# Publishes the static export to GitHub Pages on every push to main.
# Setup and the custom-domain steps are in DEPLOY_GITHUB_PAGES.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels the one still queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          # Mount point: the domain root once public/CNAME exists (custom domain),
          # /<repo> on <user>.github.io before that. Nothing to flip by hand.
          root=""; [ -f public/CNAME ] || root="/${GITHUB_REPOSITORY#*/}"
          NEXT_PUBLIC_BASE_PATH="$root" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
